name: Secure Apptainer Build and Appraisal

on:
  push:
    branches: [ main ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull the codebase into the runner
    - name: Checkout Code
      uses: actions/checkout@v6

    # 2. Automatically install Apptainer into the runner environment
    - name: Setup Apptainer
      uses: eWaterCycle/setup-apptainer@v2
      with:
        apptainer-version: 1.3.0
        enable-fakeroot: true

    # 3. Secure isolated build phase
    - name: Build Apptainer SIF File
      run: |
        # 1. Disable Ubuntu's AppArmor restriction on unprivileged user namespaces
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        apptainer build --fakeroot python-env.sif python-env.def

    # 4. The Security Appraisal: Scan the container for malware/vulnerabilities
    - name: Security Scan (Appraisal)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'python-env.sif'
        scan-type: 'image'
        severity: 'CRITICAL,HIGH'
        format: 'table'

    # 5. Cryptographically sign the verified image
    - name: Sign Container Image
      if: success()
      run: |
        echo "${{ secrets.APP_SIGNING_KEY }}" > private_key.asc
        # Import and sign using your key password if you have one
        apptainer key import private_key.asc
        
        # Pass the secret passphrase automatically to sign the image
        echo "${{ secrets.APP_SIGNING_PASSPHRASE }}" | apptainer sign --passphrase python-env.sif
        rm private_key.asc

    # 6. Upload the clean, verified artifact so you can safely use it
    - name: Upload Verified Python Container
      uses: actions/upload-artifact@v6
      with:
        name: secure-python-environment
        path: python-env.sif
