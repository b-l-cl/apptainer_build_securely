name: Secure Apptainer Build and Appraisal

on:
  push:
    branches: [ main ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull the codebase into the runner
    - name: Checkout Code
      uses: actions/checkout@v6

    # 2. Automatically install Apptainer into the runner environment
    - name: Setup Apptainer
      uses: eWaterCycle/setup-apptainer@v2
      with:
        apptainer-version: 1.3.0
        enable-fakeroot: true

    # 3. Build Step: Compile into an open sandbox directory instead of a binary file
    - name: Build Verified Python Container Sandbox
      run: |
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        apptainer build --fakeroot --sandbox python-env-sandbox python-env.def

    # 4. The Security Appraisal: Scan the local file system structure natively
    - name: Security Scan (Appraisal)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'              # 👈 Change to 'fs' to scan local folders
        image-ref: 'python-env-sandbox' # 👈 Point it right at your sandbox directory
        severity: 'CRITICAL,HIGH'
        format: 'table'
        iignore-unfixed: true   # 👈 Add this line to hide unpatchable vendor issues
        # Add this line to force Trivy to scan the entire tree including your /opt manifests
        vuln-type: 'os,library'

    # 4b. Scan the Python Environment explicitly
    - name: Security Scan (Python Libraries)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        # ⚠️ Adjust the path below if your python version is different (e.g., python3.11)
        image-ref: '.'
        file-patterns: 'pip:requirements.txt'  
        severity: 'CRITICAL,HIGH'
        format: 'table'

    # 5. Production Step: Compress the sandbox back into your final SIF image for signing
    - name: Compress Sandbox to Final SIF File
      if: success()
      run: |
        apptainer build --fakeroot python-env.sif python-env-sandbox

    # 5. Cryptographically sign the verified image
    - name: Sign Container Image
      if: success()
      run: |
        echo "${{ secrets.APP_SIGNING_KEY }}" > private_key.asc

        # 1. Pipe the passphrase to verify and authorize the key import
        echo "${{ secrets.APP_SIGNING_PASSPHRASE }}" | apptainer key import private_key.asc

        # 2. Pipe the passphrase to sign the container
        echo "${{ secrets.APP_SIGNING_PASSPHRASE }}" | apptainer sign python-env.sif

        rm private_key.asc

    # 6. Upload the clean, verified artifact so you can safely use it
    - name: Upload Verified Python Container
      uses: actions/upload-artifact@v6
      with:
        name: secure-python-environment
        path: python-env.sif
