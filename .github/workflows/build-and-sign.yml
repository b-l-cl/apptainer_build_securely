name: Secure Apptainer Build and Appraisal

on:
  push:
    branches: [ main ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull the codebase into the runner
    - name: Checkout Code
      uses: actions/checkout@v6

    # 2. Automatically install Apptainer into the runner environment
    - name: Setup Apptainer
      uses: eWaterCycle/setup-apptainer@v2
      with:
        apptainer-version: 1.3.0
        enable-fakeroot: true

    # 3. Secure isolated build phase
    - name: Build Verified Python Container
      run: |
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        # Build directly to a docker-archive tar file
        apptainer build --fakeroot python-docker.tar python-env.def

    # New Step: Unpack the SIF container to a local directory for scanning
    - name: Unpack Apptainer Image for Scanner
      run: |
        mkdir unpacked-image
        apptainer singularity image export python-env.sif | tar -C unpacked-image -xf -

    # 4. The Security Appraisal: Scan the container archive
    - name: Security Scan (Appraisal)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'python-docker.tar'
        scan-type: 'image'
        severity: 'CRITICAL,HIGH'
        format: 'table'

    # 5. Cryptographically sign the verified image
    - name: Sign Container Image
      if: success()
      run: |
        echo "${{ secrets.APP_SIGNING_KEY }}" > private_key.asc

        # 1. Pipe the passphrase to verify and authorize the key import
        echo "${{ secrets.APP_SIGNING_PASSPHRASE }}" | apptainer key import private_key.asc

        # 2. Pipe the passphrase to sign the container
        echo "${{ secrets.APP_SIGNING_PASSPHRASE }}" | apptainer sign python-env.sif

        rm private_key.asc

    # 6. Upload the clean, verified artifact so you can safely use it
    - name: Upload Verified Python Container
      uses: actions/upload-artifact@v6
      with:
        name: secure-python-environment
        path: python-env.sif
